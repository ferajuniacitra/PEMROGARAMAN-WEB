<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda &amp; Data Penyewa - RentalKu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="logo">RentalKu</div></header>
  <nav>
    <a href="index.html" class="active">Beranda &amp; Data Diri</a>
    <a href="katalog.html">Katalog &amp; Pilih Kendaraan</a>
    <a href="syarat.html">Syarat &amp; Pembayaran</a>
  </nav>

  <main class="grid-container">
    <section class="kartu beranda">
      <h1 id="teks-sambutan">Sewa Kendaraan</h1>
      <p>Temukan berbagai pilihan mobil dan motor terbaik untuk perjalanan liburan atau bisnis Anda.</p>
      <a href="#form-data-diri" class="btn-primary">Mulai Isi Data Diri</a>
    </section>

    <section class="kartu" id="form-data-diri">
      <h2>1. Data Diri Penyewa</h2>
      <form id="form-pesanan-1">
        <fieldset>
          <legend>Identitas Penyewa</legend>
          
          <div class="grup-input">
            <label for="nama">Nama Lengkap Sesuai KTP:</label>
            <input type="text" id="nama" name="nama" required>
          </div>

          <div class="form-row">
            <div class="grup-input">
              <label for="wa">Nomor WhatsApp:</label>
              <input type="tel" id="wa" name="wa" required>
            </div>
            <div class="grup-input">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required>
            </div>
          </div>

          <div class="grup-input">
            <label for="alamat">Alamat Domisili:</label>
            <textarea id="alamat" name="alamat" rows="3" required></textarea>
          </div>

          <div class="grup-input">
            <label for="ktp">Unggah KTP:</label>
            <input type="file" id="ktp" name="ktp" accept="image/*" required>
          </div>

          <div>
            <button type="submit" class="btn-primary">Lanjut Pilih Kendaraan &rarr;</button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
